
name: Extract DIVRIZ AI ZIP

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: ZIP filename in repository root
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          set -e

          if [ ! -f "$ZIP_NAME" ]; then
            echo "ZIP file not found: $ZIP_NAME"
            exit 1
          fi

          mkdir -p /tmp/divriz

          unzip -q "$ZIP_NAME" -d /tmp/divriz

          COUNT=$(find /tmp/divriz \
            -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$COUNT" -eq 1 ] && \
             [ -d "$(find /tmp/divriz -mindepth 1 -maxdepth 1)" ]; then
            SRC=$(find /tmp/divriz -mindepth 1 -maxdepth 1 -type d)
          else
            SRC=/tmp/divriz
          fi

          if [ ! -f "$SRC/package.json" ]; then
            echo "package.json not found in ZIP"
            exit 1
          fi

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$SRC/" ./

          rm -f "$ZIP_NAME"

      - name: Commit Project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract DIVRIZ AI project"
            git push
          fi

      - name: Trigger Web Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --ref "$GITHUB_REF_NAME"

      - name: Trigger APK Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run apk.yml --ref "$GITHUB_REF_NAME"
          
