
name: Delete All Repository Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Delete All Files
        run: |
          find . -mindepth 1 \
            -not -path './.git*' \
            -not -path './.github/workflows/delete-all.yml' \
            -delete

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet && exit 0

          git commit -m "Delete all repository files"
          git push
          
