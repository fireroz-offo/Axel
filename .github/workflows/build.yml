
name: Build Web (dist)

# Sirf web build + downloadable dist ZIP.
# GitHub Pages ki zarurat nahi.

on:
  push:
    branches: [main]
    paths-ignore: ['**.zip']
  workflow_dispatch:

env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund --ignore-scripts || npm install --no-audit --no-fund --ignore-scripts

      - name: Type check (informational)
        run: npm run typecheck
        continue-on-error: true

      - run: npm run build

      - run: cd dist && zip -qr ../divriz-ai-dist.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: divriz-ai-dist
          path: divriz
          -ai-dist.zip
