
name: Build and Deploy DIVRIZ AI

on:
  push:
    branches: [main]
    paths-ignore: ['**.zip']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Package dist as ZIP
        run: cd dist && zip -qr ../divriz-ai-dist.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: divriz-ai-dist
          path: divriz-ai-dist.zip

      - uses: actions/configure-pages@v5
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        
