
name: Build Web (dist)

# Web build + downloadable ZIP
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Type Check
        run: npm run typecheck
        continue-on-error: true

      - name: Build Project
        run: npm run build

      - name: Create ZIP
        run: cd dist && zip -qr ../divriz-ai-dist.zip .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: divriz-ai-dist
          path: divriz-ai-dist.zip
          
