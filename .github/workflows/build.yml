
name: Build DIVRIZ AI Web App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '*.zip'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: divriz-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run Tests
        run: npm test --if-present

      - name: Build Application
        run: npm run build

      - name: Verify Build
        run: |
          test -d dist
          test -n "$(ls -A dist)"

      - name: Create ZIP
        run: |
          cd dist
          zip -qr ../DIVRIZ-AI-WEB.zip .

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: DIVRIZ-AI-WEB
          path: DIVRIZ-AI-WEB.zip
          if-no-files-found: error
          retention-days: 30
          
