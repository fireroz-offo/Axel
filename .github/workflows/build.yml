
name: Build Web (dist)

on:
  push:
    branches: [main]
    paths-ignore: ['**.zip']
  workflow_dispatch:

env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Logic tests
        run: npm test
        continue-on-error: true

      - name: Type check
        run: npm run typecheck
        continue-on-error: true

      - name: Build web app
        run: npm run build

      - name: Create ZIP
        run: cd dist && zip -qr ../divriz-ai-dist.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: divriz-ai-dist
          path: divriz-ai-dist.zip
          
