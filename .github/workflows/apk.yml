
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '*.zip'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: divriz-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Check Capacitor
        run: |
          test -f package.json
          npx cap --version

          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ] && \
             [ ! -f capacitor.config.json ]; then
            echo "Capacitor configuration missing"
            exit 1
          fi

      - name: Build Web App
        run: npm run build

      - name: Verify Web Build
        run: |
          test -d dist
          test -n "$(ls -A dist)"

      - name: Prepare Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK file not generated"
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/DIVRIZ-AI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DIVRIZ-AI-APK
          path: output/DIVRIZ-AI.apk
          if-no-files-found: error
          retention-days: 30
          
