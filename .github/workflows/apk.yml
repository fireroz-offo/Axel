
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.zip']

env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          D=android/app/src/main/java/com/divriz/ai
          mkdir -p "$D"
          cp native/android/*.java "$D/"
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.INTERNET/a <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' "$M" || true
          sed -i 's/<application/<application android:largeHeap="true"/' "$M" || true
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk divriz-ai-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: divriz-ai-apk
          path: divriz-ai-debug.apk

      - name: Publish to Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-v1.0.0-${{ github.run_number }}" divriz-ai-debug.apk \
            --target "${{ github.sha }}" \
            --title "DIVRIZ AI v1.0.0 APK #${{ github.run_number }}" \
            --notes "Debug APK. Install unknown apps permis
            sion required."
