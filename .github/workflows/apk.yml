
name: Build Android APK

# Actions > Build Android APK > Run workflow
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.zip']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create Android project (Capacitor)
        run: |
          npx cap add android

          D=android/app/src/main/java/com/divriz/ai
          mkdir -p "$D"
          cp native/android/*.java "$D/"

          sed -i '/android.permission.INTERNET/a <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' android/app/src/main/AndroidManifest.xml || true

          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk divriz-ai-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: divriz-ai-apk
          path: divriz-ai-debug.apk

      - name: Publish to Releases (easy download)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" divriz-ai-debug.apk \
            --target "${{ github.sha }}" \
            --title "DIVRIZ AI APK #${{ github.run_number }}" \
            --notes "Debug APK. Install karne ke liye phone me 'Install unknown apps' allow karein."
            
