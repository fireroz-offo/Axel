
name: Build DIVRIZ AI Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - '*.zip'
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: divriz-android-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: divriz-gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            divriz-gradle-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Verify Capacitor
        run: |
          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ] && \
             [ ! -f capacitor.config.json ]; then
            echo "ERROR: Capacitor config missing."
            exit 1
          fi

          npx cap --version

      - name: Build Web Application
        run: npm run build

      - name: Verify Web Output
        run: |
          test -d dist
          test -n "$(ls -A dist)"

      - name: Setup Android Project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Configure Android App
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            if ! grep -q 'android:largeHeap="true"' "$MANIFEST"; then
              sed -i 's/<application/<application android:largeHeap="true"/' "$MANIFEST"
            fi
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/DIVRIZ-AI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIVRIZ-AI-Android-APK
          path: output/DIVRIZ-AI.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="divriz-ai-apk-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            output/DIVRIZ-AI.apk \
            --title "DIVRIZ AI Android APK #${GITHUB_RUN_NUMBER}" \
            --notes "DIVRIZ AI Android Debug APK."
            
